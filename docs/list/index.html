<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>What Zak's selling · zaks.life</title>
<meta name="description" content="Everything Zaks.life is selling: digital kits, merch, services and apps.">
<style>
:root{--bg:#0b0b0f;--panel:#15151c;--line:#26262f;--text:#ececf1;--muted:#9a9aa8;--pink:#ff2e93;--green:#b6ff00}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:clamp(2rem,7vw,3.2rem);margin:.2em 0;letter-spacing:-.02em}
h1 span{color:var(--pink)}
.sub{color:var(--muted);margin:0 0 20px}
.sub a{color:var(--green)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:20px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-size:1.6rem}
.stat small{color:var(--muted);text-transform:uppercase;font-size:.72rem;letter-spacing:.06em}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chips .lbl{color:var(--muted);font-size:.8rem;align-self:center;margin-right:4px;min-width:64px}
.chip{background:transparent;color:var(--text);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font:inherit;font-size:.85rem;cursor:pointer}
.chip.on{border-color:var(--green);color:#000;background:var(--green)}
.list{display:grid;gap:12px;margin-top:20px}
.card{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--pink);border-radius:12px;padding:14px 16px;display:grid;gap:6px}
.card h3{margin:0;font-size:1.1rem}
.meta{display:flex;flex-wrap:wrap;gap:8px 16px;color:var(--muted);font-size:.9rem}
.price{color:var(--green);font-weight:600}
.notes{color:var(--muted);font-size:.9rem;margin:0}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.s-live{background:var(--green);color:#000}
.s-draft{background:#3a3a48;color:#fff}
.s-blocked-payout{background:#ff8a00;color:#000}
.s-coming-soon{background:transparent;color:var(--pink);border:1px solid var(--pink)}
.s-waiting-on-james{background:var(--pink);color:#000}
.s-needs-designs{background:#6ea8ff;color:#000}
.card a{color:var(--pink);word-break:break-all}
.top{display:flex;justify-content:space-between;gap:10px;align-items:start;flex-wrap:wrap}
footer{margin-top:40px;color:var(--muted);font-size:.85rem}
@media(min-width:760px){.list{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap">
  <h1>What Zak's <span>selling</span></h1>
  <p class="sub">The live catalogue for <a href="https://zaks.life">Zaks.life</a>. Last updated: <time id="updated">…</time></p>
  <div class="stats" id="stats"></div>
  <div class="chips" id="catChips"><span class="lbl">Category</span></div>
  <div class="chips" id="statusChips"><span class="lbl">Status</span></div>
  <div class="list" id="list"><p class="notes">Loading…</p></div>
  <footer>Auto-built from <code>catalog.json</code>. Edit that file and push to update this page.</footer>
</div>
<script>
const LABEL={"live":"Live","draft":"Draft","blocked-payout":"Blocked: payout","coming-soon":"Coming soon","waiting-on-james":"Waiting on James","needs designs":"Needs designs"};
const lab=s=>LABEL[s]||s.replace(/-/g," ");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let items=[],cat="all",st="all";
function chips(el,vals,get,set,fmt){
  ["all",...vals].forEach(v=>{const b=document.createElement("button");b.className="chip"+(v===get()?" on":"");b.textContent=v==="all"?"All":fmt(v);
    b.onclick=()=>{set(v);el.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));b.classList.add("on");render()};el.appendChild(b)});
}
function render(){
  const f=items.filter(i=>(cat==="all"||i.category===cat)&&(st==="all"||i.status===st));
  document.getElementById("list").innerHTML=f.length?f.map(i=>`
   <article class="card">
     <div class="top"><h3>${esc(i.name)}</h3><span class="badge s-${esc(String(i.status).replace(/\s+/g,"-"))}">${esc(lab(i.status))}</span></div>
     <div class="meta"><span>${esc(i.category)}</span><span>${esc(i.platform)}</span><span class="price">${esc(i.price)}</span></div>
     ${i.notes?`<p class="notes">${esc(i.notes)}</p>`:""}
     ${i.url&&/^https?:\/\//.test(i.url)?`<a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.url.replace(/^https?:\/\//,""))}</a>`:""}
   </article>`).join(""):'<p class="notes">Nothing matches that filter.</p>';
}
fetch("catalog.json",{cache:"no-store"}).then(r=>r.json()).then(d=>{
  items=Array.isArray(d)?d:d.items;
  const upd=(!Array.isArray(d)&&d.updated)||items.map(i=>i.updated).sort().pop();
  const t=document.getElementById("updated");t.dateTime=upd;
  t.textContent=new Date(upd).toLocaleString("en-AU",{timeZone:"Australia/Melbourne",dateStyle:"medium",timeStyle:"short"})+" (Melbourne)";
  const counts={};items.forEach(i=>counts[i.status]=(counts[i.status]||0)+1);
  document.getElementById("stats").innerHTML=`<div class="stat"><b>${items.length}</b><small>Total</small></div>`+
    Object.entries(counts).map(([k,v])=>`<div class="stat"><b>${v}</b><small>${esc(lab(k))}</small></div>`).join("");
  chips(document.getElementById("catChips"),[...new Set(items.map(i=>i.category))],()=>cat,v=>cat=v,v=>v);
  chips(document.getElementById("statusChips"),[...new Set(items.map(i=>i.status))],()=>st,v=>st=v,lab);
  render();
}).catch(e=>{document.getElementById("list").innerHTML='<p class="notes">Could not load catalog.json.</p>'});
</script>
</body>
</html>
